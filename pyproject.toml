[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection (Kaggle 2026)"
requires-python = ">=3.11,<3.14"

# Core set: everything needed through Spec 03 (EDA, folds, label engine, cache build).
# Every pin must have a wheel installable offline on Kaggle (CLAUDE.md §3.9).
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16,<21",
    "pyyaml>=6.0,<7",
    "omegaconf>=2.3,<3",           # base.yaml uses ${oc.env:...} resolvers
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "iterative-stratification>=0.1.9,<0.2",
    "langdetect>=1.0.9,<2",        # report language census (seeded -> deterministic)
    "pydicom>=3.0,<4",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
# Decoders for JPEG Lossless / JPEG 2000 transfer syntaxes (Spec 03 + Kaggle inference).
dicom = [
    "pylibjpeg>=2.0,<3",
    "pylibjpeg-libjpeg>=2.1,<3",
    "pylibjpeg-openjpeg>=2.4,<3",
]
# Heavy training stack. Kept out of the default sync so Spec 01-02 work needs no GPU wheels;
# install with `uv sync --extra train` (or `make setup-train`).
train = [
    "torch>=2.4,<3",
    "timm>=1.0,<2",
    "albumentations>=1.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
